# CI · TutorFlow (AGENTS §9.4). Runs on every pull request to main.
#
# Jobs:
#   build-and-test   · builds the solution and runs tests/ with the fake LLM.
#   frontend         · if src/frontend/package.json exists: npm ci, npm test (non-watch) and
#                      npm run build. If it does not exist (before F4 is merged) the job passes
#                      with an explicit notice in the log.
#   commit-format    · validates format and trailer of every non-merge commit of the PR,
#                      with the same .githooks/commit-msg script used locally.
#   compose-smoke    · docker compose up with no manual setup, the backend must be able to
#                      write the audit volume and contain the corpus documents, then
#                      GET /api/salud must return 200 and, when the frontend exists, GET /
#                      must return the HTML page (D-14).
#
# The LLM key is a fake value: the LLM is a test double in tests/ and in CI (AGENTS §7, §8).
# Actions are pinned by commit SHA (the version tag is kept in a comment).

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and tests (fake LLM)
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ci-clave-ficticia-no-real
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Build the solution
        run: dotnet build src/backend/TutorFlow.sln --nologo

      - name: Run tests/
        run: dotnet test src/backend/TutorFlow.sln --no-build --nologo

  frontend:
    name: Frontend (npm ci, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Before F4 the frontend does not exist in the repository: the job then passes, with a notice.
      - name: Detect the frontend (src/frontend/package.json)
        id: detect
        run: |
          if [ -f src/frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "src/frontend/package.json found: the frontend checks run."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::src/frontend/package.json does not exist in this revision: skipping the frontend checks (F4)."
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies (npm ci)
        if: steps.detect.outputs.present == 'true'
        working-directory: src/frontend
        run: npm ci

      # CI=true makes the test runner run once and exit (no watch mode).
      - name: Run the frontend tests (npm test, non-watch)
        if: steps.detect.outputs.present == 'true'
        working-directory: src/frontend
        env:
          CI: "true"
        run: npm test

      - name: Build the frontend (npm run build)
        if: steps.detect.outputs.present == 'true'
        working-directory: src/frontend
        run: npm run build

  commit-format:
    name: Commit format and trailer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history: needed to compare the PR head with origin/<base>.
          fetch-depth: 0

      - name: Validate every non-merge commit of the PR
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          # Commits in the PR that are not in the base branch. --no-merges skips merge commits (AGENTS §9.2).
          COMMITS=$(git rev-list --no-merges "origin/$BASE_REF..$HEAD_SHA")
          if [ -z "$COMMITS" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi
          status=0
          for sha in $COMMITS; do
            subject=$(git log -1 --format=%s "$sha")
            echo "Checking $sha: $subject"
            # --strict: the message is validated exactly as git stores it. Lines starting with '#'
            # are kept (the local hook drops them), and the trailer must be the last non-blank line.
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/commit-msg.txt"
            if ! sh .githooks/commit-msg --strict "$RUNNER_TEMP/commit-msg.txt"; then
              echo "::error::Commit $sha does not follow the format of AGENTS §9.2: $subject"
              status=1
            fi
          done
          exit $status

  compose-smoke:
    name: docker compose up and GET /api/salud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Create a .env with a fake key (never a real secret)
        run: printf 'LLM_API_KEY=%s\n' "ci-clave-ficticia-no-real" > .env

      # No mkdir/chmod here on purpose: a fresh clone has no var/, and the stack must start
      # anyway (R-DEP-01). The audit-init service in docker-compose.yml prepares the volume.
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      # R-LOG-07: the backend (user app, UID 1654) must be able to write the audit volume.
      - name: The backend can write to the audit volume
        run: |
          docker compose exec -T backend sh -c 'test "$(id -u)" = 1654 && touch /app/var/auditoria/.probe && rm /app/var/auditoria/.probe'
          echo "Audit volume is writable by the backend user (UID 1654)."

      # The knowledge base (R-FUE-01) reads the three indexed documents from the image. Only those
      # files may be there: no other material/ content and no secrets (R-DEP-04).
      - name: The corpus documents are in the backend image
        run: |
          docker compose exec -T backend sh -c '
            for f in reglamento_academico_2025.md evaluacion_y_calificaciones.md bienestar_y_becas.md; do
              test -f "/app/material/reglamento/$f" || { echo "missing corpus document: $f"; exit 1; }
            done
            test ! -e /app/material/mock-api && test ! -e /app/material/reglamento/reglamento_academico_2023.md
          '
          echo "Corpus documents are in the backend image."

      - name: GET /api/salud must return 200
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://localhost:8080/api/salud)
          echo "GET /api/salud -> $code"
          test "$code" = "200"

      # D-14: the backend also serves the frontend at GET / (fallback to index.html outside /api).
      # Checked only when the frontend exists in this revision; otherwise skipped with a notice.
      - name: GET / must return the frontend HTML (only if src/frontend exists)
        run: |
          if [ ! -f src/frontend/package.json ]; then
            echo "::notice::src/frontend/package.json does not exist in this revision: skipping the GET / frontend check (D-14, F4)."
            exit 0
          fi
          code=$(curl -s -o "$RUNNER_TEMP/index.html" -w '%{http_code}' --max-time 10 http://localhost:8080/)
          echo "GET / -> $code"
          test "$code" = "200"
          grep -qi '<html' "$RUNNER_TEMP/index.html" || { echo "::error::GET / did not return HTML"; exit 1; }
          echo "GET / returns the frontend HTML."

      - name: Show container state and logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v --remove-orphans
