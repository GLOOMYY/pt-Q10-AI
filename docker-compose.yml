# TutorFlow · `docker compose up` (SPEC R-DEP-01, R-DEP-02, R-DEP-03, R-LOG-07).
#
# No manual steps (R-DEP-01): `docker compose up --build`.
# R-DEP-02: the variables are read from .env when it exists (copy of .env.example with your
# LLM_API_KEY). If .env is missing, the compose file still starts and the backend itself
# reports the missing LLM_API_KEY with a clear error.

name: tutorflow

services:
  # Simulated academic API (material/mock-api/server.js, unmodified). Reachable only
  # from the internal network: no port is published to the host.
  mock-api:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "server.js"]
    volumes:
      # material/ is the source of truth: mounted read-only (R-DEP-01).
      - ./material/mock-api:/app:ro
    expose:
      - "4000"
    networks:
      - interna
    # R-DEP-03: GET /salud. Node is already in the image, so no curl is needed.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/salud', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # One-shot init (R-LOG-07, R-DEP-01): ./var/auditoria does not exist after a clone (var/ is
  # in .gitignore), and Docker would create it as root:root 755. The backend runs as `app`
  # (UID 1654), so this service runs as root once, creates the directory and hands it to
  # UID 1654 before the backend starts. It exits with 0 and is never restarted.
  audit-init:
    image: node:22-alpine
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /app/var/auditoria && chown 1654:1654 /app/var/auditoria && chmod 0755 /app/var/auditoria"]
    volumes:
      - ./var/auditoria:/app/var/auditoria
    restart: "no"
    networks:
      - interna

  # .NET 10 backend: API (/api/*) and static frontend (/) on port 8080 (D-14).
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mock-api:
        condition: service_healthy
      audit-init:
        condition: service_completed_successfully
    # R-DEP-02: variables read from .env (not versioned). Required: LLM_API_KEY.
    # `required: false` (Compose >= 2.24): a missing .env does not stop compose; the backend
    # reports the missing variable itself.
    env_file:
      - path: ./.env
        required: false
    environment:
      # Inside the compose network the backend reaches the simulated API by service name.
      MOCK_API_URL: http://mock-api:4000
    ports:
      - "8080:8080"
    volumes:
      # R-LOG-07: the audit log auditoria.jsonl is written to the host (var/ is in .gitignore).
      # Prepared by audit-init above.
      - ./var/auditoria:/app/var/auditoria
    networks:
      - interna
      - publica
    # R-DEP-03: GET /api/salud. The aspnet image has no curl, so bash (/dev/tcp) performs
    # the HTTP request and checks that the status line is 200.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/salud HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

networks:
  # No internet access: mock-api only talks to the backend.
  interna:
    internal: true
  # Outbound access for the backend (LLM client) and publication of port 8080.
  publica: {}
